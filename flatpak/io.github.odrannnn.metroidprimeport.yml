# Flatpak manifest for the port.
#
# Unlike the AppImage, a Flatpak does not depend on the host's glibc: it comes
# from the runtime below, so the binary only has to be built against that. The
# GPU driver still comes from the host through the usual extensions, which is
# what we want.
#
# Build with tools/make_flatpak.sh. The app id is io.github.odrannnn.metroidprimeport,
# which is a domain the maintainer controls, as Flathub requires.
app-id: io.github.odrannnn.metroidprimeport
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: metroid_prime_port

finish-args:
  # Vulkan goes through the DRM device.
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # The disc image lives wherever the user keeps it; it is read-only to us.
  - --filesystem=home:ro

modules:
  - name: metroid-prime-port
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DMP_BUILD_TESTS=OFF
    post-install:
      # The binary, its data files, the desktop entry and the port's own grant
      # and notice are all installed by the project's own install rules, so
      # there is nothing here to put a binary in place. What is left is the
      # third-party notices: the two vendored snapshots come out of the tree,
      # and the fetched ones are collected here because they only exist once
      # cmake-ninja has run.
      - install -Dm644 extern/aurora/LICENSE /app/share/licenses/metroid-prime-port/aurora.txt
      - install -Dm644 extern/musyx/LICENSE /app/share/licenses/metroid-prime-port/musyx.txt
      - |
        for dep in sdl-src imgui-src fmt-src zstd-src; do
            for notice in _deps/$dep/LICENSE* _deps/$dep/COPYING*; do
                [ -f "$notice" ] || continue
                install -Dm644 "$notice" /app/share/licenses/metroid-prime-port/$dep.txt
                break
            done
        done
      # The shared libraries come from the Flatpak runtime rather than out of
      # this build, so their terms cannot be collected here; they are named the
      # way the AppImage names the ones it copies off the build host.
      - |
        {
            echo "Shared libraries come from the Flatpak runtime, not from this"
            echo "build. Their licences are those of the runtime and the"
            echo "extensions it pulls in; see the runtime's own sources."
        } > /app/share/licenses/metroid-prime-port/BUNDLED_LIBRARIES.txt
    sources:
      # The repository itself. A git source keeps the build directory, disc
      # images and other untracked files out of the sandbox, which is the whole
      # reason this is a git source and not `type: dir`.
      #
      # The branch is named because flatpak-builder defaults to `master`, and
      # this repository has no `master`: its branches are `main` and `port`, with
      # the port's work on `port`. Leaving it unset failed the build with
      # "fatal: ambiguous argument 'master'" before compiling anything. Point
      # this at whatever branch a release is cut from when publishing.
      - type: git
        path: ..
        branch: port
