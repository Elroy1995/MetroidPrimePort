name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Tools
        run: |
          brew install cmake ninja
          rustup target add aarch64-apple-ios
          pip3 install --break-system-packages gdown

      - name: Download ISO from Google Drive
        env:
          GDRIVE_ISO_ID: ${{ secrets.GDRIVE_ISO_ID }}
        run: |
          if [ -z "$GDRIVE_ISO_ID" ]; then
            echo "Error: GDRIVE_ISO_ID secret is empty."
            exit 1
          fi
          echo "Downloading GameCube disc image..."
          gdown --id "$GDRIVE_ISO_ID" -O metroid_prime.iso
          ls -lh metroid_prime.iso

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build/ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DRust_CARGO_TARGET=aarch64-apple-ios \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DAURORA_ENABLE_TESTS=OFF -DMP_BUILD_TESTS=OFF \
            2>&1 | tee configure.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          defaults write com.apple.dt.Xcode IDEBuildOperationContinueBuildingAfterErrors -bool YES || true
          cmake --build build/ios --config Release -j 4 2>&1 | tee build.log

      - name: Package Baked IPA
        shell: bash
        run: |
          APP=$(find build/ios -type d -name "metroid_prime_port.app" | head -n 1)
          if [ -z "$APP" ] || [ ! -f "$APP/metroid_prime_port" ]; then
            echo "No built metroid_prime_port.app found"
            find build/ios -name "*.app"
            exit 1
          fi

          if [ ! -f metroid_prime.iso ]; then
            echo "metroid_prime.iso not found in working directory!"
            exit 1
          fi

          # Bake the ISO into the app bundle root
          echo "Embedding disc image into app bundle..."
          cp metroid_prime.iso "$APP/game.iso"
          cp metroid_prime.iso "$APP/GM8E01.iso"

          # Enable File Sharing in Info.plist as fallback
          if [ -f "$APP/Info.plist" ]; then
            /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$APP/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$APP/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$APP/Info.plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$APP/Info.plist"
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r -0 MetroidPrime-baked.ipa Payload
          ls -lh MetroidPrime-baked.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MetroidPrime-baked-ipa
          path: MetroidPrime-baked.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            configure.log
            build.log
