name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Tools
        run: |
          brew install cmake ninja
          rustup target add aarch64-apple-ios

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build/ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DAURORA_ENABLE_TESTS=OFF -DMP_BUILD_TESTS=OFF \
            2>&1 | tee configure.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          defaults write com.apple.dt.Xcode IDEBuildOperationContinueBuildingAfterErrors -bool YES || true
          cmake --build build/ios --config Release -j 4 2>&1 | tee build.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          APP=$(find build/ios -type d -name "metroid_prime_port.app" | head -n 1)
          if [ -z "$APP" ] || [ ! -f "$APP/metroid_prime_port" ]; then
            echo "No built metroid_prime_port.app found"
            find build/ios -name "*.app"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r MetroidPrime-unsigned.ipa Payload
          ls -lh MetroidPrime-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MetroidPrime-ipa
          path: MetroidPrime-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            configure.log
            build.log
